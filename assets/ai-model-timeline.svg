      <text x="873.5" y="28" text-anchor="middle" class="year">2025</text>
      <rect class="deepseek" x="817" y="52" width="113" height="24" rx="8"/><text class="chip" x="873.5" y="68" text-anchor="middle">DeepSeek-R1</text>
      <rect class="openai" x="817" y="84" width="113" height="24" rx="8"/><text class="chip" x="873.5" y="100" text-anchor="middle">GPT-4.5</text>
      <rect class="anthropic" x="817" y="116" width="113" height="24" rx="8"/><text class="chip" x="873.5" y="132" text-anchor="middle">Claude 3.7</text>
      <rect class="google" x="817" y="148" width="113" height="24" rx="8"/><text class="chip" x="873.5" y="164" text-anchor="middle">Gemini 2.5 Pro</text>
      <rect class="meta" x="817" y="180" width="113" height="24" rx="8"/><text class="chip" x="873.5" y="196" text-anchor="middle">Llama 4</text>
      <rect class="openai" x="817" y="212" width="113" height="24" rx="8"/><text class="chip" x="873.5" y="228" text-anchor="middle">GPT-5</text>
      <rect class="xai" x="817" y="244" width="113" height="24" rx="8"/><text class="chip" x="873.5" y="260" text-anchor="middle">Grok 4</text>
      <rect class="anthropic" x="817" y="276" width="113" height="24" rx="8"/><text class="chip" x="873.5" y="292" text-anchor="middle">Claude Opus 4.5</text>
      <rect class="openai" x="817" y="308" width="113" height="24" rx="8"/><text class="chip" x="873.5" y="324" text-anchor="middle">GPT-5.1 / 5.2</text>
    </g>
    <g class="float" style="animation-delay:1.2s">
      <rect x="960" y="0" width="168" height="362" rx="16" fill="#082f49" stroke="#0ea5e9" stroke-width="1.4"/>
      <text x="1044" y="28" text-anchor="middle" class="year">2026 Jan-Jun</text>
      <rect class="openai" x="978" y="52" width="132" height="24" rx="8"/><text class="chip" x="1044" y="68" text-anchor="middle">GPT-5.3 Codex</text>
      <rect class="openai" x="978" y="84" width="132" height="24" rx="8"/><text class="chip" x="1044" y="100" text-anchor="middle">GPT-5.4</text>
      <rect class="google" x="978" y="116" width="132" height="24" rx="8"/><text class="chip" x="1044" y="132" text-anchor="middle">Gemini 3.1 Pro</text>
      <rect class="anthropic" x="978" y="148" width="132" height="24" rx="8"/><text class="chip" x="1044" y="164" text-anchor="middle">Claude Opus 4.6</text>
      <rect class="anthropic" x="978" y="180" width="132" height="24" rx="8"/><text class="chip" x="1044" y="196" text-anchor="middle">Claude Opus 4.7</text>
      <rect class="deepseek" x="978" y="212" width="132" height="24" rx="8"/><text class="chip" x="1044" y="228" text-anchor="middle">DeepSeek V4</text>
      <rect fill="#0ea5e9" x="978" y="244" width="132" height="24" rx="8"/><text class="chip" x="1044" y="260" text-anchor="middle">GPT-5.5 Max 60</text>
      <rect fill="#d946ef" x="978" y="276" width="132" height="24" rx="8"/><text class="chip" x="1044" y="292" text-anchor="middle">GPT-5.5 High 59</text>
      <rect fill="#fb923c" x="978" y="308" width="132" height="24" rx="8"/><text class="chip" x="1044" y="324" text-anchor="middle">Claude 4.7 Max 57</text>
