  <g transform="translate(92 512)">
    <rect x="0" y="0" width="1016" height="54" rx="18" fill="#1e293b" stroke="#334155"/>
    <rect class="openai" x="24" y="19" width="13" height="13" rx="3"/><text class="small" x="46" y="30">OpenAI</text>
    <rect class="anthropic" x="132" y="19" width="13" height="13" rx="3"/><text class="small" x="154" y="30">Anthropic</text>
    <rect class="google" x="260" y="19" width="13" height="13" rx="3"/><text class="small" x="282" y="30">Google</text>
    <rect class="meta" x="366" y="19" width="13" height="13" rx="3"/><text class="small" x="388" y="30">Meta</text>
    <rect class="mistral" x="468" y="19" width="13" height="13" rx="3"/><text class="small" x="490" y="30">Mistral</text>
    <rect class="deepseek" x="592" y="19" width="13" height="13" rx="3"/><text class="small" x="614" y="30">DeepSeek</text>
    <rect class="xai" x="720" y="19" width="13" height="13" rx="3"/><text class="small" x="742" y="30">xAI</text>
    <rect class="other" x="812" y="19" width="13" height="13" rx="3"/><text class="small" x="834" y="30">Open / Other</text>
  </g>

  <g transform="translate(92 585)">
    <rect x="0" y="0" width="1016" height="42" rx="14" fill="#111827" stroke="#334155"/>
    <rect class="restricted pulse" x="24" y="12" width="18" height="18" rx="5"/>
    <text class="small" x="54" y="27">Restricted watchlist: Claude Mythos / Mythos 5 and Fable 5 were reported as access-restricted or disabled after June 2026 export-control concerns.</text>
  </g>
</svg>
