      <rect class="openai" x="337" y="212" width="113" height="24" rx="8"/><text class="chip" x="393.5" y="228" text-anchor="middle">ChatGPT 3.5</text>
    </g>
    <g class="float" style="animation-delay:.6s">
      <rect class="card" x="480" y="0" width="147" height="362" rx="16"/>
      <text x="553.5" y="28" text-anchor="middle" class="year">2023</text>
      <rect class="meta" x="497" y="52" width="113" height="24" rx="8"/><text class="chip" x="553.5" y="68" text-anchor="middle">LLaMA 1</text>
      <rect class="openai" x="497" y="84" width="113" height="24" rx="8"/><text class="chip" x="553.5" y="100" text-anchor="middle">GPT-4</text>
      <rect class="anthropic" x="497" y="116" width="113" height="24" rx="8"/><text class="chip" x="553.5" y="132" text-anchor="middle">Claude 1</text>
      <rect class="google" x="497" y="148" width="113" height="24" rx="8"/><text class="chip" x="553.5" y="164" text-anchor="middle">PaLM 2</text>
      <rect class="anthropic" x="497" y="180" width="113" height="24" rx="8"/><text class="chip" x="553.5" y="196" text-anchor="middle">Claude 2</text>
      <rect class="meta" x="497" y="212" width="113" height="24" rx="8"/><text class="chip" x="553.5" y="228" text-anchor="middle">Llama 2</text>
      <rect class="mistral" x="497" y="244" width="113" height="24" rx="8"/><text class="chip" x="553.5" y="260" text-anchor="middle">Mistral 7B</text>
      <rect class="openai" x="497" y="276" width="113" height="24" rx="8"/><text class="chip" x="553.5" y="292" text-anchor="middle">GPT-4 Turbo</text>
      <rect class="google" x="497" y="308" width="113" height="24" rx="8"/><text class="chip" x="553.5" y="324" text-anchor="middle">Gemini 1.0</text>
    </g>
    <g class="float" style="animation-delay:.8s">
