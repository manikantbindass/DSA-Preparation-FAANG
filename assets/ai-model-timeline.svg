<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Frontier AI model evolution timeline from 2020 to June 2026</title>
  <desc id="desc">A dark themed timeline of major public AI model milestones with a restricted access watchlist for Claude Mythos and Fable 5.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162033"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.72 0 0 0 0 1 0 0 0 .35 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title{font:800 32px Segoe UI,Arial,sans-serif;fill:#fff}
      .sub{font:600 14px Segoe UI,Arial,sans-serif;fill:#c7d2fe}
      .year{font:800 17px Segoe UI,Arial,sans-serif;fill:#fff}
      .chip{font:800 10.5px Segoe UI,Arial,sans-serif;fill:#fff}
      .small{font:700 11px Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .tiny{font:700 9px Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .card{fill:url(#panel);stroke:#334155;stroke-width:1.1}
      .openai{fill:#10b981}.google{fill:#38bdf8}.anthropic{fill:#f59e0b}.meta{fill:#f97316}.mistral{fill:#ec4899}.deepseek{fill:#14b8a6}.xai{fill:#020617;stroke:#475569}.other{fill:#8b5cf6}.restricted{fill:#dc2626}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
      .float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .pulse{animation:pulse 2.2s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="86" r="165" fill="#0ea5e9" opacity=".08" filter="url(#glow)"/>
  <circle cx="122" cy="585" r="130" fill="#f59e0b" opacity=".07"/>
  <text x="600" y="48" text-anchor="middle" class="title">Frontier AI Model Evolution Timeline</text>
  <text x="600" y="73" text-anchor="middle" class="sub">Major public LLM milestones from 2020 to June 2026, oldest to newest</text>

  <g transform="translate(36 112)">
    <g class="float">
      <rect class="card" x="0" y="0" width="147" height="362" rx="16"/>
      <text x="73.5" y="28" text-anchor="middle" class="year">2020</text>
      <rect class="openai" x="17" y="52" width="113" height="24" rx="8"/><text class="chip" x="73.5" y="68" text-anchor="middle">GPT-3</text>
      <rect class="google" x="17" y="84" width="113" height="24" rx="8"/><text class="chip" x="73.5" y="100" text-anchor="middle">T5</text>
      <rect class="google" x="17" y="116" width="113" height="24" rx="8"/><text class="chip" x="73.5" y="132" text-anchor="middle">GShard</text>
    </g>
    <g class="float" style="animation-delay:.2s">
      <rect class="card" x="160" y="0" width="147" height="362" rx="16"/>
      <text x="233.5" y="28" text-anchor="middle" class="year">2021</text>
      <rect class="other" x="177" y="52" width="113" height="24" rx="8"/><text class="chip" x="233.5" y="68" text-anchor="middle">Jurassic-1</text>
      <rect class="openai" x="177" y="84" width="113" height="24" rx="8"/><text class="chip" x="233.5" y="100" text-anchor="middle">Codex</text>
      <rect class="google" x="177" y="116" width="113" height="24" rx="8"/><text class="chip" x="233.5" y="132" text-anchor="middle">LaMDA</text>
      <rect fill="#64748b" x="177" y="148" width="113" height="24" rx="8"/><text class="chip" x="233.5" y="164" text-anchor="middle">MT-NLG</text>
    </g>
    <g class="float" style="animation-delay:.4s">
      <rect class="card" x="320" y="0" width="147" height="362" rx="16"/>
      <text x="393.5" y="28" text-anchor="middle" class="year">2022</text>
      <rect fill="#64748b" x="337" y="52" width="113" height="24" rx="8"/><text class="chip" x="393.5" y="68" text-anchor="middle">Chinchilla</text>
      <rect class="google" x="337" y="84" width="113" height="24" rx="8"/><text class="chip" x="393.5" y="100" text-anchor="middle">PaLM</text>
      <rect class="meta" x="337" y="116" width="113" height="24" rx="8"/><text class="chip" x="393.5" y="132" text-anchor="middle">OPT</text>
      <rect class="other" x="337" y="148" width="113" height="24" rx="8"/><text class="chip" x="393.5" y="164" text-anchor="middle">BLOOM</text>
