      <rect class="google" x="657" y="52" width="113" height="24" rx="8"/><text class="chip" x="713.5" y="68" text-anchor="middle">Gemini 1.5</text>
      <rect class="anthropic" x="657" y="84" width="113" height="24" rx="8"/><text class="chip" x="713.5" y="100" text-anchor="middle">Claude 3</text>
      <rect class="other" x="657" y="116" width="113" height="24" rx="8"/><text class="chip" x="713.5" y="132" text-anchor="middle">DBRX</text>
      <rect class="meta" x="657" y="148" width="113" height="24" rx="8"/><text class="chip" x="713.5" y="164" text-anchor="middle">Llama 3</text>
      <rect class="openai" x="657" y="180" width="113" height="24" rx="8"/><text class="chip" x="713.5" y="196" text-anchor="middle">GPT-4o</text>
      <rect class="anthropic" x="657" y="212" width="113" height="24" rx="8"/><text class="chip" x="713.5" y="228" text-anchor="middle">Claude 3.5</text>
      <rect class="mistral" x="657" y="244" width="113" height="24" rx="8"/><text class="chip" x="713.5" y="260" text-anchor="middle">Mistral Large 2</text>
      <rect class="xai" x="657" y="276" width="113" height="24" rx="8"/><text class="chip" x="713.5" y="292" text-anchor="middle">Grok-2</text>
      <rect class="openai" x="657" y="308" width="113" height="24" rx="8"/><text class="chip" x="713.5" y="324" text-anchor="middle">OpenAI o1</text>
    </g>
    <g class="float" style="animation-delay:1s">
